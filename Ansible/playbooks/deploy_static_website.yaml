---
# Ansible Playbook: Static Website Deployment
# Purpose: Example playbook for deploying a simple static website using Apache

- name: Deploy Static Website
  hosts: webservers
  become: yes

  vars:

    web_package: httpd
    web_service: httpd
    website_root: /var/www/html


  tasks:

    - name: Install Apache web server
      ansible.builtin.package:
        name: "{{ web_package }}"
        state: present


    - name: Start and enable Apache service
      ansible.builtin.service:
        name: "{{ web_service }}"
        state: started
        enabled: yes


    - name: Create website homepage
      ansible.builtin.template:
        src: index.html.j2
        dest: "{{ website_root }}/index.html"
        owner: apache
        group: apache
        mode: '0644'


    - name: Open HTTP firewall service
      ansible.posix.firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes


  handlers:

    - name: Restart Apache
      ansible.builtin.service:
        name: "{{ web_service }}"
        state: restarted