---
# Ansible Playbook: Cron Job Configuration
# Purpose: Example playbook for creating scheduled tasks in Linux

- name: Configure Linux Cron Jobs
  hosts: all
  become: yes


  vars:

    cron_jobs:

      - name: Daily Backup Script
        minute: "0"
        hour: "2"
        job: "/usr/local/bin/backup.sh"

      - name: System Health Report
        minute: "0"
        hour: "8"
        job: "/usr/local/bin/health_report.sh"



  tasks:


    - name: Create backup script directory
      ansible.builtin.file:
        path: /usr/local/bin
        state: directory
        mode: '0755'



    - name: Create sample backup script
      ansible.builtin.copy:
        dest: /usr/local/bin/backup.sh
        content: |
          #!/bin/bash

          BACKUP_DIR="/backup"
          DATE=$(date +%F)

          mkdir -p $BACKUP_DIR

          tar -czf $BACKUP_DIR/server_backup_$DATE.tar.gz /etc

          echo "Backup completed on $DATE"

        mode: '0755'



    - name: Configure cron jobs
      ansible.builtin.cron:
        name: "{{ item.name }}"
        minute: "{{ item.minute }}"
        hour: "{{ item.hour }}"
        job: "{{ item.job }}"
        state: present
      loop: "{{ cron_jobs }}"