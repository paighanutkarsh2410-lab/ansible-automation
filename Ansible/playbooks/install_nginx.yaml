---
# Ansible Playbook: Install Nginx Web Server
# Purpose: Example playbook for Nginx installation and service management

- name: Install and Configure Nginx Web Server
  hosts: webservers
  become: yes

  vars:
    nginx_package: nginx
    nginx_service: nginx

  tasks:

    - name: Install Nginx package
      ansible.builtin.package:
        name: "{{ nginx_package }}"
        state: present


    - name: Enable and start Nginx service
      ansible.builtin.service:
        name: "{{ nginx_service }}"
        state: started
        enabled: yes


    - name: Deploy Nginx test page
      ansible.builtin.copy:
        dest: /usr/share/nginx/html/index.html
        content: |
          <html>
          <head>
          <title>Ansible Nginx Deployment</title>
          </head>

          <body>
          <h1>Nginx Installed Successfully Using Ansible</h1>
          <p>This server configuration was automated using Ansible.</p>
          </body>

          </html>
        owner: root
        group: root
        mode: '0644'


    - name: Configure firewall for HTTP traffic
      ansible.posix.firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes


  handlers:

    - name: Restart Nginx
      ansible.builtin.service:
        name: "{{ nginx_service }}"
        state: restarted