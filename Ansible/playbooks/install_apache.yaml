---
# Ansible Playbook: Install Apache Web Server
# Purpose: Example playbook for installing and configuring Apache on Linux servers

- name: Install and Configure Apache Web Server
  hosts: webservers
  become: yes

  vars:
    apache_package: httpd
    apache_service: httpd

  tasks:

    - name: Install Apache package
      ansible.builtin.package:
        name: "{{ apache_package }}"
        state: present

    - name: Start and enable Apache service
      ansible.builtin.service:
        name: "{{ apache_service }}"
        state: started
        enabled: yes

    - name: Create Apache test webpage
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <head>
          <title>Ansible Apache Deployment</title>
          </head>
          <body>
          <h1>Apache Installed Successfully Using Ansible</h1>
          <p>This webpage was deployed using an Ansible playbook.</p>
          </body>
          </html>
        owner: root
        group: root
        mode: '0644'

    - name: Allow HTTP service through firewall
      ansible.posix.firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes

  handlers:

    - name: Restart Apache
      ansible.builtin.service:
        name: "{{ apache_service }}"
        state: restarted